<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>

<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111413">

<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{xHandle}}">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{siteUrl}}/og.png">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/assets/styles.css?v=20261117b">
<script src="/assets/theme.js"></script>
<script src="/assets/main.js?v=20261117b" defer></script>

</script>

</head>
<body class="{{page.bodyClass}}">

</body>
</html>
